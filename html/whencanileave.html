<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When can I leave? – Giorgio Basso</title>
    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/whencanileave.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="inner">
            <a href="/index.html" class="brand">Giorgio Basso</a>
            <nav>
                <a href="/index.html">Start</a>
                <a href="/html/projects.html" aria-current="page">Projekte</a>
            </nav>
        </div>
    </header>
    <main>
        <h1>When can I leave?</h1>
        <p class="lead">Berechne deine Überstunden am Ende des Tages und sieh, wann du gehen kannst, ohne Überstunden zu opfern oder zu viel Minuszeit anzusammeln.</p>
        <form id="overtime-form" novalidate>
            <fieldset>
                <legend>Arbeitszeit</legend>
                <div class="row">
                    <div class="field">
                        <label for="start-time">Beginn</label>
                        <div class="input-group">
                            <input type="text" id="start-time" inputmode="numeric" placeholder="HH:MM" autocomplete="off">
                            <button type="button" class="now" data-target="start-time" title="Aktuelle Uhrzeit eintragen">Jetzt</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="end-time">Ende (optional)</label>
                        <div class="input-group">
                            <input type="text" id="end-time" inputmode="numeric" placeholder="HH:MM" autocomplete="off">
                            <button type="button" class="now" data-target="end-time" title="Aktuelle Uhrzeit eintragen">Jetzt</button>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Pausen</legend>
                <div id="breaks"></div>
                <button type="button" id="add-break" class="btn secondary add">+ Pause hinzufügen</button>
            </fieldset>

            <fieldset>
                <legend>Vorgaben</legend>
                <div class="row">
                    <div class="field">
                        <label for="required-work-time">Tägliche Sollarbeitszeit</label>
                        <input type="text" id="required-work-time" inputmode="numeric" placeholder="08:24" value="08:24" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="max-work-time">Maximale Arbeitszeit</label>
                        <input type="text" id="max-work-time" inputmode="numeric" placeholder="10:00" value="10:00" autocomplete="off">
                    </div>
                </div>
                <div class="field">
                    <label for="current-overtime">Überstunden-Saldo</label>
                    <input type="text" id="current-overtime" placeholder="+1:30 oder 90 (Minuten)" value="0" autocomplete="off">
                    <span class="help">Als +1:30 / -0:45 oder in Minuten. Negativ = Minusstunden.</span>
                </div>
            </fieldset>

            <button type="button" id="reset-day" class="btn secondary">Tag zurücksetzen</button>
        </form>
        <div id="result" aria-live="polite"></div>
    </main>
    <footer class="site-footer">
        <div class="inner">&copy; 2026 Giorgio Basso</div>
    </footer>
</body>
</html>
