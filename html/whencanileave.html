<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When can I leave?</title>
    <link rel="stylesheet" href="/css/whencanileave.css">
    <link rel="stylesheet" href="/css/index.css">

    <script src="/js/whencanileave.js" defer></script>
</head>
<body>
    <h1>When can I leave?</h1>
    <p>When can I leave is a site to calculate your overtime at the end of a day,<br>so you can see when you can leave without having to <br>sacrifice your overtime or get too much minus time.</p>
    
    <div class="calculator-container">
        <h2>Overtime Calculator</h2>
        <form id="overtime-form">
            <div class="input-section work-times">
                <h4>Work Times</h4>
                <div class="form-group time-pair">
                    <div class="time-input-wrapper">
                        <label for="start-time">Start Time:</label>
                        <input type="text" id="start-time" class="time-input" placeholder="HH:MM" pattern="^([01]\d|2[0-3]):([0-5]\d)$" required>
                    </div>
                    <div class="time-input-wrapper">
                        <label for="end-time">End Time:</label>
                        <input type="text" id="end-time" class="time-input" placeholder="HH:MM" pattern="^([01]\d|2[0-3]):([0-5]\d)$" required>
                    </div>
                </div>
            </div>

            <div class="input-section break-times">
                
                <h4>Break Times</h4>
                <div class="form-group time-pair">
                    <div class="time-input-wrapper">
                        <label for="start-break-time">Start Break:</label>
                        <input type="text" id="start-break-time" class="time-input" placeholder="HH:MM" pattern="^([01]\d|2[0-3]):([0-5]\d)$" required>
                    </div>
                    <div class="time-input-wrapper">
                        <label for="end-break-time">End Break:</label>
                        <input type="text" id="end-break-time" class="time-input" placeholder="HH:MM" pattern="^([01]\d|2[0-3]):([0-5]\d)$" required>
                    </div>
                </div>
            </div>
           
            <div class="input-section other-inputs">
                <div class="form-group">
                    <label for="required-work-time">Required Daily Work (HH:MM):</label>
                    <input type="text" id="required-work-time" placeholder="08:24" value="08:24" pattern="^([01]\d|2[0-3]):([0-5]\d)$" required>
                </div>
                
                <div class="form-group">
                    <label for="current-overtime">Current Total Overtime (minutes):</label>
                    <input type="number" id="current-overtime" value="0" required>
                </div>
            </div>

            <button type="submit">Calculate Overtime</button>
        </form>

        <div id="result">
            </div>
    </div>
</body>
</html>
